<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goa + Gokarna Solo Mission</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-[#050505] text-white min-h-screen">
  <div id="root"></div>

  <script type="text/babel">

    const { useState } = React;

    const itinerary = [
      {
        day: 1,
        date: "May 23",
        title: "Goa Arrival + Sunset Social",
        objectives: [
          { text: "Flight Mumbai → Goa", map: "Mopa Airport Goa" },
          { text: "Check-in at The Hosteller Vagator", map: "The Hosteller Goa Vagator" },
          { text: "Rent Scooty", map: "Vagator Goa" },
          { text: "Vagator Sunset", map: "Vagator Beach Goa" },
          { text: "Chapora Fort", map: "Chapora Fort Goa" },
          { text: "Night at Titlie", map: "Titlie Vagator" }
        ],
        food: {
          breakfast: {
            name: "Airport Cafe",
            map: "Mopa Airport Goa",
            mustTry: ["Coffee", "Sandwich"]
          },
          lunch: {
            name: "Artjuna",
            map: "Artjuna Anjuna",
            mustTry: ["Shakshuka", "Cold Brew"]
          },
          dinner: {
            name: "Titlie",
            map: "Titlie Vagator",
            mustTry: ["Cocktails", "Chicken Ghee Roast"]
          }
        }
      },
      {
        day: 2,
        date: "May 24",
        title: "North Goa Water Sports",
        objectives: [
          { text: "Parasailing at Baga", map: "Baga Beach Goa" },
          { text: "Jet Ski Ride", map: "Calangute Beach Goa" },
          { text: "Banana Ride", map: "Calangute Beach Goa" },
          { text: "Sweet Water Lake", map: "Sweet Water Lake Arambol" },
          { text: "Purple Martini Sunset", map: "Purple Martini Goa" },
          { text: "Anjuna Nightlife", map: "Anjuna Goa" }
        ],
        food: {
          breakfast: {
            name: "Babka Goa",
            map: "Babka Goa",
            mustTry: ["Pancakes", "Cold Brew"]
          },
          lunch: {
            name: "Fat Fish",
            map: "Fat Fish Goa",
            mustTry: ["King Fish Thali", "Fried Squid"]
          },
          dinner: {
            name: "Purple Martini",
            map: "Purple Martini Goa",
            mustTry: ["Cocktails", "Seafood"]
          }
        }
      },
      {
        day: 3,
        date: "May 25",
        title: "South Goa Hidden Mission",
        objectives: [
          { text: "Cola Beach Lagoon", map: "Cola Beach Goa" },
          { text: "Cabo De Rama Cliff Ride", map: "Cabo de Rama Goa" },
          { text: "Kakolem Hidden Beach", map: "Kakolem Beach Goa" },
          { text: "Sunset at Cabo De Rama", map: "Cabo de Rama Cliff Goa" },
          { text: "Night Bus to Gokarna", map: "Gokarna Karnataka" }
        ],
        food: {
          breakfast: {
            name: "South Goa Shack",
            map: "South Goa",
            mustTry: ["Ross Omelette", "Tea"]
          },
          lunch: {
            name: "The Cape Goa",
            map: "The Cape Goa",
            mustTry: ["Butter Garlic Prawns", "Fish Curry Rice"]
          },
          dinner: {
            name: "Fisherman's Wharf",
            map: "Fisherman's Wharf Goa",
            mustTry: ["Crab Masala", "Prawn Balchao"]
          }
        }
      },
      {
        day: 4,
        date: "May 26",
        title: "Full Gokarna Reset",
        objectives: [
          { text: "Kudle Beach Morning", map: "Kudle Beach Gokarna" },
          { text: "Om Beach Trek", map: "Om Beach Gokarna" },
          { text: "Kayaking", map: "Om Beach Gokarna" },
          { text: "Half Moon Beach", map: "Half Moon Beach Gokarna" },
          { text: "Beach Drinks + Music", map: "Kudle Beach Gokarna" }
        ],
        food: {
          breakfast: {
            name: "Namaste Cafe",
            map: "Namaste Cafe Gokarna",
            mustTry: ["Pancakes", "Cold Coffee"]
          },
          lunch: {
            name: "Mantra Cafe",
            map: "Mantra Cafe Gokarna",
            mustTry: ["Pizza", "Smoothie Bowl"]
          },
          dinner: {
            name: "Sunset Cafe",
            map: "Sunset Cafe Gokarna",
            mustTry: ["Beer", "Fish Fry"]
          }
        }
      },
      {
        day: 5,
        date: "May 27",
        title: "Slow Morning + Return",
        objectives: [
          { text: "Morning Beach Walk", map: "Kudle Beach Gokarna" },
          { text: "Breakfast at Prema", map: "Prema Restaurant Gokarna" },
          { text: "Leave Gokarna", map: "Gokarna Karnataka" },
          { text: "Goa Airport Return Flight", map: "Mopa Airport Goa" }
        ],
        food: {
          breakfast: {
            name: "Prema Restaurant",
            map: "Prema Restaurant Gokarna",
            mustTry: ["South Indian Breakfast", "Coffee"]
          },
          lunch: {
            name: "Local Cafe",
            map: "Gokarna Karnataka",
            mustTry: ["Seafood Meals", "Lemon Soda"]
          },
          dinner: {
            name: "Airport Cafe",
            map: "Mopa Airport Goa",
            mustTry: ["Coffee", "Snacks"]
          }
        }
      }
    ];

    const hostels = [
      {
        name: "The Hosteller Vagator",
        location: "Vagator, North Goa",
        link: "https://www.thehosteller.com/hostels/the-hosteller-goa-vagator/"
      },
      {
        name: "Zostel Morjim",
        location: "Morjim, Goa",
        link: "https://www.zostel.com/zostel/goa/morjim/"
      },
      {
        name: "Zostel Gokarna",
        location: "Gokarna, Karnataka",
        link: "https://www.zostel.com/zostel/gokarna/"
      }
    ];

    const budget = [
      { item: "Flights", price: 7000 },
      { item: "Hostels", price: 3500 },
      { item: "Scooty + Fuel", price: 2000 },
      { item: "Water Activities", price: 2500 },
      { item: "Food + Drinks", price: 5000 }
    ];

    function App() {
      const [openDay, setOpenDay] = useState(null);
      const [showBudget, setShowBudget] = useState(false);

      const getMap = (place) => {
        window.open(
          `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place)}`,
          '_blank'
        );
      };

      const total = budget.reduce((sum, item) => sum + item.price, 0);

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 font-['Comic_Neue']">

          <h1 className="text-4xl sm:text-6xl md:text-8xl font-bold mb-4 leading-tight">
            🌴 GOA + GOKARNA
          </h1>

          <p className="text-zinc-400 text-lg sm:text-xl mb-10">
            May 23 → May 27 Solo Mission
          </p>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">

            <div className="border border-blue-500 p-6 rounded-3xl bg-zinc-900/30">
              <h2 className="text-3xl font-bold mb-4 text-blue-400">
                🔥 MUST DO
              </h2>

              <ul className="space-y-3 text-lg">
                <li>Parasailing</li>
                <li>Purple Martini Sunset</li>
                <li>Cola Beach Lagoon</li>
                <li>Gokarna Trek</li>
                <li>Beach Drinks + Music</li>
              </ul>
            </div>

            <div className="border border-red-500 p-6 rounded-3xl bg-zinc-900/30">
              <h2 className="text-3xl font-bold mb-4 text-red-400">
                🏝️ HIDDEN SPOTS
              </h2>

              <ul className="space-y-3 text-lg">
                <li>Sweet Water Lake</li>
                <li>Kakolem Beach</li>
                <li>Half Moon Beach</li>
                <li>Chapora Sunset</li>
              </ul>
            </div>

          </div>

          <h2 className="text-4xl sm:text-5xl font-bold mb-8">
            🗺️ ITINERARY
          </h2>

          <div className="space-y-6">
            {itinerary.map((day, index) => (
              <div
                key={index}
                className="border border-zinc-800 rounded-3xl overflow-hidden"
              >

                <button
                  onClick={() => setOpenDay(openDay === index ? null : index)}
                  className="w-full text-left p-4 sm:p-6 bg-zinc-900 hover:bg-zinc-800 transition"
                >

                  <div className="flex justify-between items-center gap-4">
                    <div>
                      <p className="text-blue-400 uppercase tracking-widest text-sm sm:text-base">
                        {day.date}
                      </p>

                      <h2 className="text-xl sm:text-3xl font-bold mt-1 leading-tight">
                        {day.title}
                      </h2>
                    </div>

                    <div className="text-3xl sm:text-4xl shrink-0">
                      {openDay === index ? '−' : '+'}
                    </div>
                  </div>
                </button>

                {openDay === index && (
                  <div className="p-4 sm:p-6 bg-black">

                    <h3 className="text-2xl font-bold mb-4 text-blue-400">
                      📍 Places
                    </h3>

                    <div className="space-y-3 mb-8">
                      {day.objectives.map((obj, i) => (
                        <div
                          key={i}
                          className="flex flex-col sm:flex-row gap-4 justify-between sm:items-center bg-zinc-900 p-4 rounded-2xl"
                        >

                          <span className="text-base sm:text-lg">
                            {obj.text}
                          </span>

                          <button
                            onClick={() => getMap(obj.map)}
                            className="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-xl text-sm sm:text-base"
                          >
                            Open Map
                          </button>
                        </div>
                      ))}
                    </div>

                    <h3 className="text-2xl font-bold mb-4 text-green-400">
                      🍴 Food Plan
                    </h3>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      {["breakfast", "lunch", "dinner"].map((meal) => (
                        <div
                          key={meal}
                          className="bg-zinc-900 p-5 rounded-2xl"
                        >

                          <h4 className="text-xl font-bold capitalize mb-2">
                            {meal}
                          </h4>

                          <button
                            onClick={() => getMap(day.food[meal].map)}
                            className="text-blue-400 underline text-left"
                          >
                            {day.food[meal].name}
                          </button>

                          <ul className="mt-3 space-y-2 text-zinc-300 text-sm sm:text-base">
                            {day.food[meal].mustTry.map((food, idx) => (
                              <li key={idx}>✨ {food}</li>
                            ))}
                          </ul>

                        </div>
                      ))}
                    </div>

                  </div>
                )}

              </div>
            ))}
          </div>

          <div className="fixed bottom-5 right-5 z-50">
            <button
              onClick={() => setShowBudget(!showBudget)}
              className="bg-blue-600 hover:bg-blue-500 transition px-5 py-4 rounded-2xl font-bold shadow-2xl"
            >
              {showBudget ? 'Close Budget' : 'Open Budget'}
            </button>
          </div>

          {showBudget && (
            <div className="mt-16 border border-blue-500 rounded-3xl p-5 sm:p-8 bg-[#0b0b0b]">

              <h2 className="text-3xl sm:text-5xl font-bold mb-8">
                💰 Budget
              </h2>

              <div className="space-y-5">
                {budget.map((b, i) => (
                  <div key={i}>
                    <div className="flex justify-between gap-4 mb-2 text-sm sm:text-xl">
                      <span>{b.item}</span>
                      <span className="font-bold">₹{b.price}</span>
                    </div>

                    <div className="h-4 bg-zinc-800 rounded-full overflow-hidden">
                      <div
                        className="h-full bg-blue-500"
                        style={{ width: `${(b.price / 7000) * 100}%` }}
                      ></div>
                    </div>
                  </div>
                ))}
              </div>

              <div className="mt-10 border-t border-zinc-700 pt-6">
                <h3 className="text-4xl sm:text-6xl font-bold break-words">
                  ₹{total}
                </h3>

                <p className="text-zinc-400 mt-2 text-sm sm:text-base">
                  Estimated Total Budget
                </p>
              </div>

            </div>
          )}

          <div className="mt-20 border border-green-500 p-6 sm:p-8 rounded-3xl bg-zinc-900/30">
            <h2 className="text-3xl sm:text-5xl font-bold mb-8 text-green-400">
              🏠 HOSTELS
            </h2>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              {hostels.map((h, i) => (
                <div
                  key={i}
                  className="bg-black/40 p-5 rounded-3xl border border-zinc-800"
                >
                  <h3 className="font-bold text-xl sm:text-2xl mb-2">
                    {h.name}
                  </h3>

                  <p className="text-zinc-400 mb-5 text-sm sm:text-base">
                    {h.location}
                  </p>

                  <a
                    href={h.link}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="inline-block w-full text-center bg-green-600 hover:bg-green-500 transition px-4 py-3 rounded-2xl text-sm sm:text-base font-bold"
                  >
                    Open Hostel Link
                  </a>
                </div>
              ))}
            </div>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>
</html>
