                                          title="View Location"
                                        >
                                          <MapPin size={18} className="md:w-5 md:h-5" />
                                        </button>
                                      )}
                                    </li>
                                  ))}
                                </ul>
                              </div>

                              {d.food && (
                                <div className="bg-black/50 p-4 md:p-8 border-2 border-zinc-800 rounded-2xl md:rounded-3xl">
                                  <h5 className="text-xl md:text-2xl font-bold text-blue-400 uppercase flex items-center gap-2 md:gap-3 mb-4 md:mb-6">
                                    🍹 SUSTENANCE
                                  </h5>
                                  
                                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
                                    <div className="bg-zinc-900/80 p-4 md:p-5 rounded-2xl border border-white/5 hover:border-blue-500/30 transition-colors">
                                      <div className="flex items-center justify-between mb-2 md:mb-3 border-b border-white/5 pb-2">
                                        <span className="text-xs md:text-sm font-bold tracking-widest text-zinc-500 uppercase flex items-center gap-2">
                                          <Coffee size={14}/> Breakfast
                                        </span>
                                      </div>
                                      <button 
                                        onClick={() => window.open(getMapLink(d.food.breakfast.map))} 
                                        className="text-lg md:text-xl font-bold text-white hover:text-blue-400 flex items-center gap-2 mb-3 md:mb-4 text-left"
                                      >
                                        {d.food.breakfast.name} <ExternalLink size={14} className="shrink-0"/>
                                      </button>
                                      <div className="flex flex-wrap gap-2">
                                        {d.food.breakfast.mustTry.map((item, i) => (
                                          <span key={i} className="px-2 py-1 bg-blue-900/20 text-blue-300 border border-blue-500/20 rounded-md text-[10px] md:text-[11px] font-bold">
                                            ✨ {item}
                                          </span>
                                        ))}
                                      </div>
                                    </div>

                                    <div className="bg-zinc-900/80 p-4 md:p-5 rounded-2xl border border-white/5 hover:border-blue-500/30 transition-colors">
                                      <div className="flex items-center justify-between mb-2 md:mb-3 border-b border-white/5 pb-2">
                                        <span className="text-xs md:text-sm font-bold tracking-widest text-zinc-500 uppercase flex items-center gap-2">
                                          <Utensils size={14}/> Lunch
                                        </span>
                                      </div>
                                      <button 
                                        onClick={() => window.open(getMapLink(d.food.lunch.map))} 
                                        className="text-lg md:text-xl font-bold text-white hover:text-blue-400 flex items-center gap-2 mb-3 md:mb-4 text-left"
                                      >
                                        {d.food.lunch.name} <ExternalLink size={14} className="shrink-0"/>
                                      </button>
                                      <div className="flex flex-wrap gap-2">
                                        {d.food.lunch.mustTry.map((item, i) => (
                                          <span key={i} className="px-2 py-1 bg-blue-900/20 text-blue-300 border border-blue-500/20 rounded-md text-[10px] md:text-[11px] font-bold">
                                            ✨ {item}
                                          </span>
                                        ))}
                                      </div>
                                    </div>

                                    <div className="bg-zinc-900/80 p-4 md:p-5 rounded-2xl border border-white/5 hover:border-blue-500/30 transition-colors">
                                      <div className="flex items-center justify-between mb-2 md:mb-3 border-b border-white/5 pb-2">
                                        <span className="text-xs md:text-sm font-bold tracking-widest text-zinc-500 uppercase flex items-center gap-2">
                                          <Moon size={14}/> Dinner
                                        </span>
                                      </div>
                                      <button 
                                        onClick={() => window.open(getMapLink(d.food.dinner.map))} 
                                        className="text-lg md:text-xl font-bold text-white hover:text-blue-400 flex items-center gap-2 mb-3 md:mb-4 text-left"
                                      >
                                        {d.food.dinner.name} <ExternalLink size={14} className="shrink-0"/>
                                      </button>
                                      <div className="flex flex-wrap gap-2">
                                        {d.food.dinner.mustTry.map((item, i) => (
                                          <span key={i} className="px-2 py-1 bg-blue-900/20 text-blue-300 border border-blue-500/20 rounded-md text-[10px] md:text-[11px] font-bold">
                                            ✨ {item}
                                          </span>
                                        ))}
                                      </div>
                                    </div>

                                  </div>
                                </div>
                              )}

                            </div>
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                )}

                {showBudget && (
                  <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md p-4 md:p-12 overflow-y-auto animate-in zoom-in-95 duration-500 flex items-center justify-center">
                    <div className="w-full max-w-4xl bg-zinc-950 p-6 md:p-16 rounded-[2rem] md:rounded-[4rem] border-4 border-blue-600 shadow-2xl mt-4 md:mt-0">
                      <div className="flex justify-between items-center mb-8 md:mb-16 border-b border-white/10 pb-4 md:pb-8">
                        <h2 className="text-4xl md:text-7xl font-bold tracking-tighter uppercase text-white">BUDGET</h2>
                        <button onClick={() => setShowBudget(false)} className="text-2xl md:text-5xl bg-zinc-900 w-12 h-12 md:w-20 md:h-20 rounded-full border-2 border-white/10 flex items-center justify-center hover:bg-red-600 transition-colors">✕</button>
                      </div>

                      <div className="space-y-6 md:space-y-10">
                        {budget.map((b, i) => (
                          <div key={i} className="group">
                            <div className="flex justify-between mb-2 md:mb-3 font-bold text-sm md:text-xl uppercase text-zinc-500 group-hover:text-blue-400 transition-colors tracking-widest">
                              <span>{b.item}</span>
                              <span className="text-2xl md:text-4xl text-white font-bold tracking-tighter">₹{b.price.toLocaleString()}</span>
                            </div>
                            <div className="h-3 md:h-6 bg-zinc-900 border-2 border-white/5 p-0.5 md:p-1 rounded-full">
                              <div className={`h-full ${b.color} transition-all duration-1000 rounded-full`} style={{ width: `${(b.price / 8000) * 100}%` }}></div>
                            </div>
                          </div>
                        ))}

                        <div className="pt-8 md:pt-16 mt-8 md:mt-16 border-t-4 border-dashed border-white/10 flex flex-col items-start gap-2 md:gap-4">
                          <p className="text-[4rem] md:text-[8rem] font-bold text-white tracking-tighter leading-none">₹{totalBudget.toLocaleString()}</p>
                          <p className="text-lg md:text-2xl font-bold text-blue-500 uppercase tracking-[0.2em] md:tracking-[0.5em]">Total Mission Budget</p>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </main>

              {/* Floating Budget Button */}
              <div className="fixed bottom-4 right-4 md:bottom-10 md:right-10 z-40">
                <button 
                  onClick={() => setShowBudget(true)}
                  className="bg-blue-600 px-4 py-3 md:px-8 md:py-5 rounded-[1.5rem] md:rounded-[2rem] shadow-[0_10px_40px_rgba(37,99,235,0.5)] border-2 border-white/20 hover:scale-105 transition-all flex items-center gap-2 md:gap-4 font-bold text-lg md:text-2xl text-white"
                >
                  <CreditCard size={24} className="md:w-7 md:h-7" />
                  <span className="hidden md:inline">BUDGET</span>
                </button>
              </div>

              <footer className="mt-24 md:mt-40 text-center pb-8 md:pb-12 opacity-30 font-bold uppercase tracking-[0.5em] md:tracking-[1em] text-[10px] md:text-xs text-zinc-400">
                Goa Recon Ops
              </footer>
            </div>
          );
        };

        // 3. Render the application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
